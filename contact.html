<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo">TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Enter a destination or keyword">
      <button type="button" id="btnSearch" onclick="window.location.href='index.html'">Search</button>
      <button type="button" id="btnClear" onclick="document.getElementById('searchInput').value=''">Clear</button>
    </div>
  </nav>

  <main class="page-section">
    <h1>Contact Us</h1>
    <p>
      Have questions about your next trip or want personalized destination advice?
      Reach us at <strong>support@travelbloom.example.com</strong> or fill out the email form below.
    </p>

    <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.'); this.reset();">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
